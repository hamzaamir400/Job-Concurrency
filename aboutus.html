<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Collection of Watches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #92b7e8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: royalblue;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 1rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        form {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: left; /* Align the form elements to the left */
            max-width: 400px; /* Set max width for better readability */
            width: 100%;
        }

        form label {
            display: block;
            margin-bottom: 0.5rem;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        form input[type="submit"] {
            background-color: royalblue;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            background-color: royalblue;
            color: white;
            text-align: left;
            padding: 1rem;
        }

        footer p {
            margin: 0;
        }

        .social-icons {
            margin-top: 1rem;
        }

        .social-icons img {
            width: 24px;
            height: 24px;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .social-icons a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>COLLECTION OF WATCHES</h1>
        <nav>
            <ul>
                <li><a href="men.html">Mens</a></li>
                <li><a href="women.html">Womens</a></li>
                <li><a href="kids.html">Kids</a></li>
                <li><a href="couples.html">Couples</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <input type="submit" value="Submit">
        </form>
    </main>

    <footer>
        <p>Company Name: Collection of Watches</p><br>
        <p>Contact Number: +92-3416390045</p><br>
        <p>About Us:
            Our Collection: Mens Watches | Ladies Watches | Couple Watches | Eid ul adha sale.</p>
        <br>
        <p>© 2024 Collection of Watches Store.</p>
        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
            </a>
            <a href="https://wa.me" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            </a>
        </div>
    </footer>
</body>
</html>
